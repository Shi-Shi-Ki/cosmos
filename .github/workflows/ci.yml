name: ci (reusable)

# 各リポジトリの team-ci.yml から呼ばれる共通の CI。機械で確実に見つかる問題を PR ごとに検出する。
# 該当するファイルがない項目は飛ばすので、TS / GAS / PHP / Terraform のどのリポジトリでも同じ呼び出しで使える。
# フレームワークやツールの選択はリポジトリに任せ、ここでは構文・依存・秘密情報と、リポジトリが scripts に書いた lint / test だけを扱う。
# 失敗したときは、どのチェックがなぜ落ちたかと対応方法を PR にコメントする（Actions のログを開かなくてよいように）。
on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: "24"
      terraform-dir:
        type: string
        default: terraform
      terraform-version:
        type: string
        default: "~1.9"
      # composer.json に PHP のバージョンが書かれていないときに使う
      php-version:
        type: string
        default: "8.3"
      # 調べる対象のディレクトリ（末尾に / を付ける）。cosmos の結合テストでサンプルを指すときだけ使う
      working-directory:
        type: string
        default: ""
      # 失敗の内容を PR にコメントするか。結合テストでは false にする
      comment:
        type: boolean
        default: true
      # チェックが失敗してもジョブを成功扱いにし、結果は outputs だけで返す。結合テストで、わざと壊したサンプルを赤くしないために使う
      allow-failure:
        type: boolean
        default: false
    # 共通スクリプトを取得するための GitHub App の秘密鍵（任意）。cosmos が private のときに使う。
    # 呼び出し側は secrets: inherit で渡し、App ID は Variables の SYNC_APP_ID に置く
    secrets:
      SYNC_APP_PRIVATE_KEY:
        required: false
    # 各チェックの結果（success / failure）。結合テストで期待どおりかを確かめるのに使う
    outputs:
      typescript:
        value: ${{ jobs.typescript.outputs.result }}
      terraform:
        value: ${{ jobs.terraform.outputs.result }}
      secrets:
        value: ${{ jobs.secrets.outputs.result }}
      php:
        value: ${{ jobs.php.outputs.result }}
      gas:
        value: ${{ jobs.gas.outputs.result }}

jobs:
  # 各ジョブが使うスクリプト（scripts/ci/）を、呼ばれた cosmos の同じコミットから取得して配る。
  # github.repository は呼び出し側を指すので、呼ばれた側は job.workflow_repository / job.workflow_sha で知る。
  # cosmos を private にしたときは、呼び出し側の標準のトークンでは読めないため GitHub App のトークンを使う
  # （Variables の SYNC_APP_ID と Secrets の SYNC_APP_PRIVATE_KEY があれば使い、なければ標準のトークン）。
  scripts:
    name: 共通スクリプトを取得
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 呼ばれた cosmos のリポジトリとコミットを調べる
        id: source
        env:
          # actionlint がまだ job.workflow_* を知らないため、toJSON で受け取る
          JOB_CONTEXT: ${{ toJSON(job) }}
        run: |
          repo=$(jq -r '.workflow_repository // empty' <<<"$JOB_CONTEXT")
          sha=$(jq -r '.workflow_sha // empty' <<<"$JOB_CONTEXT")
          if [ -z "$repo" ] || [ -z "$sha" ]; then
            echo "::error::呼ばれた cosmos のリポジトリとコミットを取得できませんでした"
            exit 1
          fi
          echo "cosmos: $repo@$sha"
          { echo "repo=$repo"; echo "sha=$sha"; echo "owner=${repo%%/*}"; echo "name=${repo#*/}"; } >> "$GITHUB_OUTPUT"

      - id: app-token
        if: vars.SYNC_APP_ID != ''
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.SYNC_APP_ID }}
          private-key: ${{ secrets.SYNC_APP_PRIVATE_KEY }}
          owner: ${{ steps.source.outputs.owner }}
          repositories: ${{ steps.source.outputs.name }}

      - uses: actions/checkout@v4
        with:
          repository: ${{ steps.source.outputs.repo }}
          ref: ${{ steps.source.outputs.sha }}
          token: ${{ steps.app-token.outputs.token || github.token }}
          path: cosmos
          sparse-checkout: scripts/ci
          persist-credentials: false

      - uses: actions/upload-artifact@v4
        with:
          name: cosmos-scripts
          path: cosmos/scripts/ci
          if-no-files-found: error
          retention-days: 1

  typescript:
    name: TypeScript（型チェック・lint・format・テスト）
    needs: scripts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      result: ${{ steps.status.outputs.result }}
    defaults:
      run:
        shell: bash -eo pipefail {0}
        working-directory: ${{ inputs.working-directory || '.' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: cosmos-scripts
          path: ${{ runner.temp }}/cosmos-scripts

      - name: 共通スクリプトとログの置き場所を用意する
        run: |
          mkdir -p "$RUNNER_TEMP/ci-logs"
          { echo "LOGS=$RUNNER_TEMP/ci-logs"; echo "COSMOS_SCRIPTS=$RUNNER_TEMP/cosmos-scripts"; } >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v4
        if: hashFiles(format('{0}pnpm-lock.yaml', inputs.working-directory)) != ''
        with:
          version: 10

      - uses: actions/setup-node@v4
        if: hashFiles(format('{0}package.json', inputs.working-directory)) != ''
        with:
          node-version: ${{ inputs.node-version }}

      # lockfile どおりにだけ入れる
      - name: 依存を入れる
        id: deps
        continue-on-error: ${{ inputs.allow-failure }}
        if: hashFiles(format('{0}package.json', inputs.working-directory)) != ''
        run: |
          if [ -f pnpm-lock.yaml ]; then echo "x=pnpm exec" >> "$GITHUB_OUTPUT"; echo "run=pnpm" >> "$GITHUB_OUTPUT"; pnpm install --frozen-lockfile 2>&1 | tee "$LOGS/deps.log"
          elif [ -f package-lock.json ]; then echo "x=npx --no-install" >> "$GITHUB_OUTPUT"; echo "run=npm" >> "$GITHUB_OUTPUT"; npm ci 2>&1 | tee "$LOGS/deps.log"
          else echo "lockfile がありません" | tee "$LOGS/deps.log"; echo "::error::lockfile がありません（pnpm-lock.yaml か package-lock.json をコミットしてください）"; exit 1
          fi

      - name: 型チェック
        id: tsc
        continue-on-error: ${{ inputs.allow-failure }}
        if: steps.deps.outcome == 'success' && hashFiles(format('{0}tsconfig.json', inputs.working-directory)) != ''
        run: ${{ steps.deps.outputs.x }} tsc --noEmit 2>&1 | tee "$LOGS/tsc.log"

      # package.json の lint スクリプトは --fix 付きのことがあるため、CI では検出だけを行う
      - name: Lint
        id: eslint
        continue-on-error: ${{ inputs.allow-failure }}
        if: (success() || failure()) && steps.deps.outcome == 'success' && hashFiles(format('{0}eslint.config.*', inputs.working-directory), format('{0}.eslintrc*', inputs.working-directory)) != ''
        run: ${{ steps.deps.outputs.x }} eslint . 2>&1 | tee "$LOGS/eslint.log"

      - name: Format
        id: prettier
        continue-on-error: ${{ inputs.allow-failure }}
        if: (success() || failure()) && steps.deps.outcome == 'success' && hashFiles(format('{0}.prettierrc*', inputs.working-directory), format('{0}prettier.config.*', inputs.working-directory)) != ''
        run: ${{ steps.deps.outputs.x }} prettier --check "**/*.{ts,tsx,js,jsx,mjs,cjs}" 2>&1 | tee "$LOGS/prettier.log"

      - name: テスト
        id: test
        continue-on-error: ${{ inputs.allow-failure }}
        if: (success() || failure()) && steps.deps.outcome == 'success'
        run: |
          if jq -e '.scripts.test' package.json >/dev/null; then ${{ steps.deps.outputs.run }} test 2>&1 | tee "$LOGS/test.log"; else echo "test スクリプトがないため飛ばします"; fi

      - name: 失敗の内容をまとめる
        if: failure()
        env:
          RUN: ${{ steps.deps.outputs.run || 'pnpm' }}
          X: ${{ steps.deps.outputs.x || 'pnpm exec' }}
          DEPS: ${{ steps.deps.outcome }}
          TSC: ${{ steps.tsc.outcome }}
          ESLINT: ${{ steps.eslint.outcome }}
          PRETTIER: ${{ steps.prettier.outcome }}
          TEST: ${{ steps.test.outcome }}
        run: bash "$COSMOS_SCRIPTS/report-typescript.sh"

      - id: status
        if: always()
        run: echo "result=${{ (job.status == 'failure' || contains(steps.*.outcome, 'failure')) && 'failure' || 'success' }}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ci-report-typescript
          path: ${{ runner.temp }}/ci-logs/report.md
          if-no-files-found: ignore
          retention-days: 3

  terraform:
    name: Terraform（fmt・validate）
    needs: scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      result: ${{ steps.status.outputs.result }}
    defaults:
      run:
        shell: bash -eo pipefail {0}
        working-directory: ${{ inputs.working-directory || '.' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: cosmos-scripts
          path: ${{ runner.temp }}/cosmos-scripts

      - name: 共通スクリプトとログの置き場所を用意する
        run: |
          mkdir -p "$RUNNER_TEMP/ci-logs"
          { echo "LOGS=$RUNNER_TEMP/ci-logs"; echo "COSMOS_SCRIPTS=$RUNNER_TEMP/cosmos-scripts"; } >> "$GITHUB_ENV"

      - id: tf
        run: |
          if ls "${{ inputs.terraform-dir }}"/*.tf >/dev/null 2>&1; then echo "found=true" >> "$GITHUB_OUTPUT"; fi

      - uses: hashicorp/setup-terraform@v3
        if: steps.tf.outputs.found == 'true'
        with:
          terraform_version: ${{ inputs.terraform-version }}
          terraform_wrapper: false

      - name: fmt
        id: fmt
        continue-on-error: ${{ inputs.allow-failure }}
        if: steps.tf.outputs.found == 'true'
        working-directory: ${{ inputs.working-directory }}${{ inputs.terraform-dir }}
        run: terraform fmt -check -recursive 2>&1 | tee "$LOGS/fmt.log"

      # backend とクラウドには接続しない（認証情報は使わない）
      - name: validate
        id: validate
        continue-on-error: ${{ inputs.allow-failure }}
        if: (success() || failure()) && steps.tf.outputs.found == 'true'
        working-directory: ${{ inputs.working-directory }}${{ inputs.terraform-dir }}
        run: |
          terraform init -backend=false -input=false -no-color 2>&1 | tee "$LOGS/validate.log"
          terraform validate -no-color 2>&1 | tee -a "$LOGS/validate.log"

      - name: 失敗の内容をまとめる
        if: failure()
        env:
          DIR: ${{ inputs.terraform-dir }}
          FMT: ${{ steps.fmt.outcome }}
          VALIDATE: ${{ steps.validate.outcome }}
        run: bash "$COSMOS_SCRIPTS/report-terraform.sh"

      - id: status
        if: always()
        run: echo "result=${{ (job.status == 'failure' || contains(steps.*.outcome, 'failure')) && 'failure' || 'success' }}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ci-report-terraform
          path: ${{ runner.temp }}/ci-logs/report.md
          if-no-files-found: ignore
          retention-days: 3

  secrets:
    name: 秘密情報の検出
    needs: scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      result: ${{ steps.status.outputs.result }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory || '.' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: cosmos-scripts
          path: ${{ runner.temp }}/cosmos-scripts

      - name: 共通スクリプトとログの置き場所を用意する
        run: |
          mkdir -p "$RUNNER_TEMP/ci-logs"
          { echo "LOGS=$RUNNER_TEMP/ci-logs"; echo "COSMOS_SCRIPTS=$RUNNER_TEMP/cosmos-scripts"; } >> "$GITHUB_ENV"

      # state や変数ファイルには、平文の秘密情報や構成情報が入るため、コミットさせない
      - name: tfstate / tfvars / .env がコミットされていないか
        id: tracked
        continue-on-error: ${{ inputs.allow-failure }}
        run: bash "$COSMOS_SCRIPTS/check-tracked-files.sh"

      # 結果はジョブのサマリーに出す。PR へのコメントは下でまとめて行う
      - uses: gitleaks/gitleaks-action@v2
        id: gitleaks
        continue-on-error: ${{ inputs.allow-failure }}
        if: success() || failure()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_ENABLE_COMMENTS: "false"

      # 秘密情報の値はコメントに載せない（ルール・ファイル・行・コミットだけ）
      - name: 失敗の内容をまとめる
        if: failure()
        env:
          TRACKED: ${{ steps.tracked.outcome }}
          GITLEAKS: ${{ steps.gitleaks.outcome }}
        run: bash "$COSMOS_SCRIPTS/report-secrets.sh"

      - id: status
        if: always()
        run: echo "result=${{ (job.status == 'failure' || contains(steps.*.outcome, 'failure')) && 'failure' || 'success' }}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ci-report-secrets
          path: ${{ runner.temp }}/ci-logs/report.md
          if-no-files-found: ignore
          retention-days: 3

  # PHP: フレームワークやツールには依存せず、どのリポジトリでも同じ意味を持つことだけを調べる。
  #   構文（php -l）、composer.json の妥当性、lockfile どおりの依存、既知の脆弱性（composer audit）、
  #   リポジトリが composer.json の scripts に書いた lint / test。
  # PHP のバージョンは composer.json の config.platform.php → require.php の下限 → 入力値 php-version の順に決める。
  # ランナーの PHP と同じバージョンならそれを使い、違えば Docker の公式イメージ php:<version>-cli で実行する。
  php:
    name: PHP（構文・composer・スクリプト）
    needs: scripts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      result: ${{ steps.status.outputs.result }}
    defaults:
      run:
        shell: bash -eo pipefail {0}
        working-directory: ${{ inputs.working-directory || '.' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: cosmos-scripts
          path: ${{ runner.temp }}/cosmos-scripts

      - name: 共通スクリプトとログの置き場所を用意する
        run: |
          mkdir -p "$RUNNER_TEMP/ci-logs"
          { echo "LOGS=$RUNNER_TEMP/ci-logs"; echo "COSMOS_SCRIPTS=$RUNNER_TEMP/cosmos-scripts"; } >> "$GITHUB_ENV"

      - name: PHP のバージョンを決める
        id: setup
        env:
          DEFAULT_VERSION: ${{ inputs.php-version }}
        run: bash "$COSMOS_SCRIPTS/php-setup.sh"

      - name: 構文
        id: syntax
        continue-on-error: ${{ inputs.allow-failure }}
        if: steps.setup.outputs.found == 'true'
        run: bash "$COSMOS_SCRIPTS/php-syntax.sh"

      - name: composer.json の検証
        id: validate
        continue-on-error: ${{ inputs.allow-failure }}
        if: (success() || failure()) && steps.setup.outputs.found == 'true' && hashFiles(format('{0}composer.json', inputs.working-directory)) != ''
        run: composer validate --no-check-publish --no-check-lock --no-interaction 2>&1 | tee "$LOGS/php-validate.log"

      # 依存は lockfile どおりにだけ入れる。プラグインとインストール時のスクリプトは実行しない（サプライチェーン対策）。
      # 拡張モジュールの有無はリポジトリの事情なので、インストール時には確かめない
      - name: 依存を入れる
        id: deps
        continue-on-error: ${{ inputs.allow-failure }}
        if: (success() || failure()) && steps.setup.outputs.found == 'true' && hashFiles(format('{0}composer.json', inputs.working-directory)) != ''
        run: bash "$COSMOS_SCRIPTS/php-deps.sh"

      - name: 既知の脆弱性（composer audit）
        id: audit
        continue-on-error: ${{ inputs.allow-failure }}
        if: (success() || failure()) && steps.deps.outputs.installed == 'true' && hashFiles(format('{0}composer.lock', inputs.working-directory)) != ''
        run: composer audit --locked --no-interaction --abandoned=ignore 2>&1 | tee "$LOGS/php-audit.log"

      # 何を使って lint / test するかはリポジトリが composer.json の scripts で決める
      - name: リポジトリの lint
        id: lint
        continue-on-error: ${{ inputs.allow-failure }}
        if: (success() || failure()) && steps.deps.outputs.installed == 'true'
        run: |
          if jq -e '.scripts.lint' composer.json >/dev/null; then composer-target run-script lint --no-interaction 2>&1 | tee "$LOGS/php-lint.log"; else echo "composer.json に lint スクリプトがないため飛ばします"; fi

      - name: リポジトリの test
        id: test
        continue-on-error: ${{ inputs.allow-failure }}
        if: (success() || failure()) && steps.deps.outputs.installed == 'true'
        run: |
          if jq -e '.scripts.test' composer.json >/dev/null; then composer-target run-script test --no-interaction 2>&1 | tee "$LOGS/php-test.log"; else echo "composer.json に test スクリプトがないため飛ばします"; fi

      - name: 失敗の内容をまとめる
        if: failure()
        env:
          SYNTAX: ${{ steps.syntax.outcome }}
          VALIDATE: ${{ steps.validate.outcome }}
          DEPS: ${{ steps.deps.outcome }}
          AUDIT: ${{ steps.audit.outcome }}
          LINT: ${{ steps.lint.outcome }}
          TEST: ${{ steps.test.outcome }}
        run: bash "$COSMOS_SCRIPTS/report-php.sh"

      - id: status
        if: always()
        run: echo "result=${{ (job.status == 'failure' || contains(steps.*.outcome, 'failure')) && 'failure' || 'success' }}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ci-report-php
          path: ${{ runner.temp }}/ci-logs/report.md
          if-no-files-found: ignore
          retention-days: 3

  # GAS: .gs と、appsscript.json のあるディレクトリの .js を、JavaScript（スクリプト）として構文だけ調べる。
  # lint や format はリポジトリが package.json の scripts で決める（TypeScript のジョブで実行される）
  gas:
    name: GAS（構文）
    needs: scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      result: ${{ steps.status.outputs.result }}
    defaults:
      run:
        shell: bash -eo pipefail {0}
        working-directory: ${{ inputs.working-directory || '.' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: cosmos-scripts
          path: ${{ runner.temp }}/cosmos-scripts

      - name: 共通スクリプトとログの置き場所を用意する
        run: |
          mkdir -p "$RUNNER_TEMP/ci-logs"
          { echo "LOGS=$RUNNER_TEMP/ci-logs"; echo "COSMOS_SCRIPTS=$RUNNER_TEMP/cosmos-scripts"; } >> "$GITHUB_ENV"

      - name: 対象のファイルを集める
        id: files
        run: bash "$COSMOS_SCRIPTS/gas-files.sh"

      - uses: actions/setup-node@v4
        if: steps.files.outputs.found == 'true'
        with:
          node-version: ${{ inputs.node-version }}

      # GAS は ES モジュールではなくスクリプトとして読み込まれるので、vm.Script で構文だけを確かめる（依存なし）
      - name: 構文
        id: syntax
        continue-on-error: ${{ inputs.allow-failure }}
        if: steps.files.outputs.found == 'true'
        env:
          LIST: ${{ steps.files.outputs.list }}
        run: bash "$COSMOS_SCRIPTS/gas-syntax.sh"

      - name: 失敗の内容をまとめる
        if: failure()
        env:
          SYNTAX: ${{ steps.syntax.outcome }}
        run: bash "$COSMOS_SCRIPTS/report-gas.sh"

      - id: status
        if: always()
        run: echo "result=${{ (job.status == 'failure' || contains(steps.*.outcome, 'failure')) && 'failure' || 'success' }}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ci-report-gas
          path: ${{ runner.temp }}/ci-logs/report.md
          if-no-files-found: ignore
          retention-days: 3

  # 失敗のまとめを 1 つのコメントにして PR に載せる。次の実行で成功したら、同じコメントを「解消」に書き換える。
  # 呼び出し側（team-ci.yml）に pull-requests: write がない場合や fork の PR では、コメントせずに終わる。
  report:
    name: 結果を PR にコメント
    needs: [scripts, typescript, terraform, secrets, php, gas]
    if: always() && inputs.comment && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cosmos-scripts
          path: ${{ runner.temp }}/cosmos-scripts

      - name: 共通スクリプトとログの置き場所を用意する
        run: |
          mkdir -p "$RUNNER_TEMP/ci-logs"
          { echo "LOGS=$RUNNER_TEMP/ci-logs"; echo "COSMOS_SCRIPTS=$RUNNER_TEMP/cosmos-scripts"; } >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v4
        with:
          pattern: ci-report-*
          path: reports
        continue-on-error: true

      - name: コメントを書く
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: bash "$COSMOS_SCRIPTS/post-comment.sh"
