name: sync-claude-config

# sync/ の内容を、sync-targets.json に書いたリポジトリへ PR として配る
on:
  push:
    branches: [main]
    paths: ["sync/**", "sync-targets.json"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  targets:
    runs-on: ubuntu-latest
    outputs:
      repos: ${{ steps.read.outputs.repos }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        run: echo "repos=$(jq -c '.repos' sync-targets.json)" >> "$GITHUB_OUTPUT"

  sync:
    needs: targets
    if: needs.targets.outputs.repos != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        repo: ${{ fromJSON(needs.targets.outputs.repos) }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: standards

      - id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.SYNC_APP_ID }}
          private-key: ${{ secrets.SYNC_APP_PRIVATE_KEY }}
          repositories: ${{ matrix.repo }}

      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/${{ matrix.repo }}
          token: ${{ steps.app-token.outputs.token }}
          path: target

      # sync/ をコピーし、{{COSMOS_REPO}} をこのリポジトリ名に置き換える。
      # cosmos を業務の Organization などに複製しても、置き換えなしでその複製を参照する
      - name: Copy managed files
        env:
          SYNC_CLAUDE_REVIEW: ${{ vars.SYNC_CLAUDE_REVIEW }}
        run: |
          cp -R standards/sync/. target/
          (cd standards/sync && find . -type f) | while read -r f; do
            sed -i "s#{{COSMOS_REPO}}#${GITHUB_REPOSITORY}#g" "target/$f"
          done
          # Team の Code Review（@claude review）を使う環境では、同じ言葉で二重に動かないよう配らない（既に配ったものは削除する）
          if [ "$SYNC_CLAUDE_REVIEW" = "false" ]; then
            rm -f target/.github/workflows/team-claude-review.yml
          fi

      - uses: peter-evans/create-pull-request@v7
        with:
          path: target
          token: ${{ steps.app-token.outputs.token }}
          branch: chore/sync-claude-config
          title: "chore: 共通 Claude 設定の同期"
          body: |
            ${{ github.repository }} の ${{ github.sha }} を反映します。
            管理対象のファイル（REVIEW.md、.claude/rules/team-*.md、.github/workflows/team-*.yml）以外は変更しません。
          labels: claude-config-sync
