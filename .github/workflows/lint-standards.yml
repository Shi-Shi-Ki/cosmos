name: lint-standards

# 中央で管理する md と plugin の形式をチェックする。
# 月次の内容の見直しは refresh-standards.yml で行う
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix tools/lint
      - run: node tools/lint/lint.mjs
