name: lint-standards

# 中央で管理する md と plugin の形式をチェックする。
# 毎月 1 日にも実行し、変更がなくても古くなったルールを警告する
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 0 1 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix tools/lint
      - run: node tools/lint/lint.mjs
