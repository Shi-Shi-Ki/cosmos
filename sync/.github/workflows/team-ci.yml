# {{COSMOS_REPO}} で管理。このリポジトリでは編集しない
# 型チェック・lint・format・テスト、Terraform の fmt / validate、秘密情報の検出を PR ごとに行う。
# 失敗したときは、原因と対応方法を PR にコメントする（そのために pull-requests: write が要る）。
name: team-ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: team-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    permissions:
      contents: read
      pull-requests: write
    uses: "{{COSMOS_REPO}}/.github/workflows/ci.yml@main"
    # cosmos が private のとき、共通スクリプトの取得に GitHub App の秘密鍵（SYNC_APP_PRIVATE_KEY）を使う
    secrets: inherit
